server.port=${SERVER_PORT:8081}

# 默认连接开发机（本机）的 MySQL，避免容器内 localhost 指向容器自身；
# 部署到其它环境时通过 DB_URL 环境变量覆盖
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.102.28:3306/java_simulation_project?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.dal.dialect=MYSQL
spring.dal.need-tenant-filter=false
spring.dal.use-redis-worker-id=false
spring.liquibase.enabled=true

management.endpoints.web.exposure.include=health,info
